name: 01 - Test AirSat Service Connections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private processing runner
        uses: actions/checkout@v4
        with:
          repository: Attarbashian/airsat-processing-runner
          ref: main
          token: ${{ secrets.AIRSAT_RUNNER_READ_PAT }}
          fetch-depth: 1
          path: runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal connection dependencies
        run: python -m pip install --upgrade earthengine-api requests

      - name: Verify Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          base = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          if not base or not key:
              raise SystemExit("Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY")
          headers = {"apikey": key, "Accept": "application/json"}
          if key.startswith("eyJ"):
              headers["Authorization"] = f"Bearer {key}"
          r = requests.get(
              base + "/rest/v1/site_settings?select=key&limit=1",
              headers=headers,
              timeout=30,
          )
          print("Supabase HTTP:", r.status_code)
          r.raise_for_status()
          print("Supabase connection succeeded.")
          PY

      - name: Verify Earth Engine
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: |
          python - <<'PY'
          import json, os
          import ee
          raw = os.environ.get("EE_SERVICE_ACCOUNT_JSON", "")
          project = os.environ.get("EE_PROJECT", "")
          if not raw or not project:
              raise SystemExit("Missing EE_SERVICE_ACCOUNT_JSON or EE_PROJECT")
          info = json.loads(raw)
          credentials = ee.ServiceAccountCredentials(
              info["client_email"], key_data=json.dumps(info)
          )
          ee.Initialize(credentials, project=project)
          print("Earth Engine authentication succeeded for project:", project)
          PY
