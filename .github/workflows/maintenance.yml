name: AirSat Cloud Maintenance

on:
  workflow_dispatch:
  schedule:
    # Twice per hour, away from the top-of-hour scheduling peak.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: airsat-cloud-maintenance
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pending: ${{ steps.probe.outputs.has_pending }}
      pending_count: ${{ steps.probe.outputs.pending_count }}

    steps:
      - name: Keep Supabase active and probe stale pending requests
        id: probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PENDING_MIN_AGE_MINUTES: "10"
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          age = int(os.environ.get("PENDING_MIN_AGE_MINUTES", "10"))

          if not base or not key:
              raise SystemExit("Missing Supabase secrets.")

          headers = {"apikey": key, "Accept": "application/json"}
          if key.startswith("eyJ"):
              headers["Authorization"] = f"Bearer {key}"

          heartbeat = Request(
              base + "/rest/v1/site_settings?select=key&limit=1",
              headers=headers,
          )
          with urlopen(heartbeat, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"Supabase heartbeat HTTP {response.status}")
              response.read()

          threshold = (
              datetime.now(timezone.utc) - timedelta(minutes=age)
          ).isoformat()

          query = urlencode({
              "status": "eq.pending",
              "created_at": f"lt.{threshold}",
              "select": "id",
              "order": "created_at.asc",
              "limit": "5",
          })
          req = Request(
              base + "/rest/v1/download_requests?" + query,
              headers=headers,
          )
          with urlopen(req, timeout=30) as response:
              rows = json.loads(response.read().decode("utf-8"))

          count = len(rows)
          print(f"Supabase heartbeat succeeded. Stale pending requests: {count}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_pending={'true' if count else 'false'}\n")
              fh.write(f"pending_count={count}\n")
          PY

  recover:
    needs: probe
    if: needs.probe.outputs.has_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout private processing runner
        uses: actions/checkout@v7
        with:
          repository: Attarbashian/airsat-processing-runner
          ref: main
          token: ${{ secrets.AIRSAT_RUNNER_READ_PAT }}
          fetch-depth: 1
          path: runner

      - name: Checkout private airsat-auto time-series data
        uses: actions/checkout@v7
        with:
          repository: Attarbashian/airsat-auto
          ref: main
          token: ${{ secrets.AIRSAT_AUTO_RW_PAT }}
          fetch-depth: 1
          path: target

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache OpenStreetMap tiles
        uses: actions/cache@v6
        with:
          path: ~/.cache/airsat-osm
          key: airsat-osm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            airsat-osm-${{ runner.os }}-

      - name: Install Persian Vazir font and dependencies
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/share/fonts/airsat
          sudo curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Regular.ttf" \
            --output /usr/local/share/fonts/airsat/Vazir-Regular.ttf
          sudo curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.ttf" \
            --output /usr/local/share/fonts/airsat/Vazir-Bold.ttf
          sudo fc-cache -f
          python -m pip install --upgrade pip
          python -m pip install earthengine-api requests pillow arabic-reshaper python-bidi

      - name: Recover stale pending requests
        env:
          AIRSAT_AUTO_ROOT: ${{ github.workspace }}/target
          AIRSAT_FONT_DIR: /usr/local/share/fonts/airsat
          AIRSAT_TIMESERIES_FALLBACK: "true"
          AIRSAT_OSM_CACHE_DIR: ~/.cache/airsat-osm
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AIRSAT_EMAIL_FROM: ${{ secrets.AIRSAT_EMAIL_FROM }}
          AIRSAT_EMAIL_REPLY_TO: ${{ secrets.AIRSAT_EMAIL_REPLY_TO }}
          SMSIR_API_KEY: ${{ secrets.SMSIR_API_KEY }}
          SMSIR_READY_TEMPLATE_ID: ${{ secrets.SMSIR_READY_TEMPLATE_ID }}
          PENDING_MIN_AGE_MINUTES: "10"
          MAX_PENDING_REQUESTS: "5"
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EE_PROVINCES_ASSET: ${{ secrets.EE_PROVINCES_ASSET }}
          EE_PROVINCE_NAME_FIELD: ${{ secrets.EE_PROVINCE_NAME_FIELD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPORT_BUCKET: airsat-exports
        run: python runner/scripts/process_pending_requests.py
