name: AirSat Provincial Refresh (public runner, private data)
on:
  push:
    branches:
      - feat/airsat-province-automation-20261120
      - main
    paths:
      - .github/workflows/province-refresh.yml
      - ops/province-refresh-activate.txt
  workflow_dispatch:
    inputs:
      execute:
        description: "Build and publish missing provincial months (false = offline QA only)"
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows:
      - "05 - AirSat Data Orchestrator"
    types:
      - completed

permissions:
  contents: read

# Does not change national Action 5; follow it after successful completion.
# The workflow_run trigger is disabled until AIRSAT_PROVINCE_REFRESH_ENABLED=true.
concurrency:
  group: airsat-province-data-writer
  cancel-in-progress: false

jobs:
  yazd:
    name: Yazd scientific-cache QA / incremental publication
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.AIRSAT_PROVINCE_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private AirSat data and province scripts
        uses: actions/checkout@v4
        with:
          repository: Attarbashian/airsat-auto
          ref: ${{ github.ref == 'refs/heads/feat/airsat-province-automation-20261120' && 'fix/airsat-province-incremental-20261120' || 'main' }}
          token: ${{ secrets.AIRSAT_AUTO_RW_PAT }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile provincial Python modules
        run: python -m compileall -q target/scripts

      - name: Diagnose existing static-resilience gate (informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python target/scripts/validate_static_resilience.py

      - name: Unit-test durable cache
        run: python -m unittest discover -s target/scripts -p 'test_airsat_province_cache.py' -v

      - name: Verify archived science before any Earth Engine work
        run: python target/scripts/validate_province_cache_qa.py

      - name: Print read-only province refresh plan
        run: python target/scripts/plan_yazd_refresh.py

      - name: Install scientific processing dependency
        if: github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.execute == true
        run: python -m pip install earthengine-api

      - name: Run existing scientific builders with durable month reuse
        if: github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.execute == true
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EE_PROVINCES_ASSET: ${{ secrets.EE_PROVINCES_ASSET }}
          EE_PROVINCE_NAME_FIELD: ${{ secrets.EE_PROVINCE_NAME_FIELD }}
          AIRSAT_ALLOW_VALIDATED_LEGACY_CACHE: "1"
          AIRSAT_PROVINCE_INCREMENTAL_REQUIRED: "1"
        run: |
          python target/scripts/plan_yazd_refresh.py --execute

      - name: Verify updated science after processing
        if: github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.execute == true
        run: |
          python target/scripts/validate_province_cache_qa.py
          for pollutant in NO2 SO2 CO; do
            python target/scripts/validate_yazd_analytics.py --pollutant "$pollutant"
            python target/scripts/validate_yazd_attribution.py --pollutant "$pollutant"
          done
          python target/scripts/validate_yazd_ch4_screening.py
          python target/scripts/validate_yazd_dust_screening.py

      - name: Publish only validated Yazd outputs to private AirSat
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.execute == true) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           github.event.head_commit.message == 'ops: activate province data migration')
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/yazd
          if git diff --cached --quiet; then
            echo "No new provincial outputs; keeping historical archive unchanged"
            exit 0
          fi
          git commit -m "data(yazd): incrementally refresh validated provincial results"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Publication conflict. Private AirSat data was NOT overwritten."
            exit 1
          fi
          git push origin HEAD:main
