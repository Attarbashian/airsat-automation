name: AirSat Supabase Heartbeat

on:
  schedule:
    # 00:10 Iran time (UTC+03:30)
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airsat-supabase-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run a real lightweight health query
        env:
          SUPABASE_HEARTBEAT_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_HEARTBEAT_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          set -euo pipefail

          test -n "${SUPABASE_HEARTBEAT_URL:-}"
          test -n "${SUPABASE_HEARTBEAT_SECRET_KEY:-}"

          CLEAN_URL="$(printf '%s' "$SUPABASE_HEARTBEAT_URL" \
            | tr -d '\r\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed 's:/*$::')"

          case "$CLEAN_URL" in
            https://*.supabase.co)
              ;;
            *)
              echo "::error::SUPABASE_HEARTBEAT_URL has an invalid format."
              exit 1
              ;;
          esac

          CURL_HEADERS=(
            --header "apikey: ${SUPABASE_HEARTBEAT_SECRET_KEY}"
            --header "Accept: application/json"
          )

          if [[ "${SUPABASE_HEARTBEAT_SECRET_KEY}" == eyJ* ]]; then
            CURL_HEADERS+=(
              --header "Authorization: Bearer ${SUPABASE_HEARTBEAT_SECRET_KEY}"
            )
          fi

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --output /tmp/airsat-heartbeat-response.json \
            --write-out "%{http_code}" \
            "${CURL_HEADERS[@]}" \
            "${CLEAN_URL}/rest/v1/site_settings?select=key&limit=1")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Supabase heartbeat failed with HTTP ${HTTP_CODE}."
            cat /tmp/airsat-heartbeat-response.json || true
            exit 1
          fi

          echo "AirSat Supabase heartbeat completed successfully."
